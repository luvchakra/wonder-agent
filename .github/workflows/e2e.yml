name: E2E (Playwright on Vercel)

# Nightly, not per change (user decision 2026-10-09, CLAUDE.md §19.6). A run
# can also be started by hand, optionally for chosen spec files only
# (e.g. "tests/e2e/groups.spec.ts").
#
# The suite runs on Vercel, not here (user decision 2026-10-10): it needs
# the project's Sensitive variables (Supabase service role key, encryption
# key, cron secret), which never leave Vercel. This workflow only:
#   1. moves the `e2e/nightly` branch to the tip of main, with one marker
#      commit so Vercel always sees a new commit to build;
#   2. waits for Vercel's status on that commit. Its build runs the suite
#      (scripts/vercel-build.sh → scripts/e2e-on-vercel.sh) and fails when a
#      test fails, so this job goes red with it.
# No secrets are needed here; GITHUB_TOKEN pushes the branch and reads the
# status.
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
    inputs:
      specs:
        description: "Spec files to run (space-separated); empty runs the full suite"
        required: false
        default: ""

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: write
  statuses: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # The marker commit is attributed to the repository owner so Vercel
      # builds it like the owner's own pushes. The input goes through an
      # environment variable, never straight into the script; the build
      # accepts only tests/e2e/*.spec.ts paths from it.
      - name: Move e2e/nightly to main
        id: push
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          git config user.name "luvchakra"
          git config user.email "luvchakra@gmail.com"
          msg="Nightly E2E run on Vercel ($(date -u +%Y-%m-%dT%H:%MZ))"
          if [ -n "$SPECS" ]; then
            git commit --allow-empty -m "$msg" -m "specs: $SPECS"
          else
            git commit --allow-empty -m "$msg"
          fi
          git push --force origin HEAD:refs/heads/e2e/nightly
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for the suite on Vercel
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          # Vercel reports the build as a commit status. Up to 70 minutes:
          # queueing behind another build, install, build and the suite.
          for i in $(seq 1 140); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/statuses" \
              --jq '[.[] | select(.context | startswith("Vercel"))][0] // empty | "\(.state) \(.target_url)"' 2>/dev/null || true)
            case "$state" in
              success*) echo "The suite passed on Vercel: ${state#success }"; exit 0 ;;
              failure*|error*) echo "::error::The suite failed on Vercel. Build log: ${state#* }"; exit 1 ;;
            esac
            if [ "$i" = "12" ] && [ -z "$state" ]; then
              echo "::error::Vercel did not start a build for ${SHA} within 6 minutes."
              exit 1
            fi
            sleep 30
          done
          echo "::error::No result from Vercel within 70 minutes."
          exit 1
