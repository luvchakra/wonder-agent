name: E2E (Playwright)

# Nightly, not per change (user decision 2026-10-09, CLAUDE.md §19.6): the full
# suite runs every night against main; a run can also be started by hand,
# optionally for chosen spec files only (e.g. "tests/e2e/groups.spec.ts").
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
    inputs:
      specs:
        description: "Spec files to run (space-separated); empty runs the full suite"
        required: false
        default: ""

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # QA Agent's Playwright suite (docs/plan/11-QA-AGENT-BACKLOG.md,
      # QA-P0-06 + the FinanceBot central-scenario E2E coverage) runs
      # against the same dev Supabase project the app itself uses — the
      # secrets above must point at that project. This job builds a real
      # production bundle itself (playwright.config.ts's webServer),
      # exactly matching what `npm run build && npm run start` produces
      # locally, so a passing run here is a genuine pre-deploy signal.
      # The input goes through an environment variable, never straight into
      # the script, so it cannot inject shell commands.
      - name: Run Playwright E2E suite
        env:
          SPECS: ${{ inputs.specs }}
        run: npx playwright test $SPECS

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
